<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <h1>🍟 McDonald's</h1>
                <p>Explore Our Delicious Menu</p>
            </div>
        </div>
    </header>

    <!-- Filter Buttons -->
    <div class="filter-container">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="burgers">Burgers</button>
        <button class="filter-btn" data-filter="chicken">Chicken</button>
        <button class="filter-btn" data-filter="sides">Sides</button>
        <button class="filter-btn" data-filter="drinks">Drinks</button>
        <button class="filter-btn" data-filter="desserts">Desserts</button>
    </div>

    <!-- Menu Grid -->
    <main class="menu-container">
        <div class="menu-grid" id="menuGrid">
            <!-- Menu items will be inserted here by JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 McDonald's Menu Website. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
